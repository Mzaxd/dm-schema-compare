# 达梦数据库结构差异对比工具 - 示例配置
#
# 使用方法：复制本文件为 config.ini，填入真实连接信息。
# config.ini 已被 .gitignore 忽略，不会提交到仓库。
#
# 支持两种配置模式（二选一，程序按配置段自动识别）：
# - dual:   [source_env_*] 多连接源端 + [target_env_*] 多连接目标端（本示例默认，见下）
# - legacy: [test_env] 单连接源端 + [prod_env_*] 多连接目标端（见文末注释块）
#
# 页面启动后会自动扫描脚本目录下所有 config*.ini 供选择。

# ---------- dual 模式：源端（每个模式一个配置段，schema 即路由键） ----------
[source_env_base]
host = 192.168.1.100
port = 5236
schema = SRC_APP
user = SRC_APP
password = your_password

# ---------- dual 模式：目标端（每个模式一个配置段） ----------
[target_env_base]
host = 192.168.1.200
port = 5236
schema = APP
user = APP
password = your_password

[options]
# 排除的系统模式（逗号分隔）
exclude_schemas = SYS,SYSDBA,CTISYS,SYSJOB,SYSAUDITOR
# 排除的序列名模式（glob 通配符，逗号分隔），默认已排除 Liquibase 元数据序列
# exclude_sequences =
# 模式名映射：源端模式:目标端模式（逗号分隔），两端模式不同名时使用
# schema_mapping = SRC_APP:APP
# 源端/目标端显示名（用于报告与页面）
# source_label = 源端
# target_label = 目标端
# 输出目录（相对脚本路径或绝对路径）
output_dir = ./reports

[ddl_tuning]
# 执行 DDL 时会话级启用快速加列与延长 DDL 等锁时间（仅本会话，断开自动失效）
enabled = true
alter_table_opt = 3
ddl_wait_time = 60

# ---------- legacy 模式（与 dual 二选一：取消下面注释并删除上方 source_env_*/target_env_* 段） ----------
# 源端：单连接，提取该实例上所有模式（排除 exclude_schemas）
# [test_env]
# host = 192.168.1.100
# port = 5236
# user = SYSDBA
# password = your_password
#
# 目标端：每个模式一个配置段
# [prod_env_base]
# host = 192.168.1.200
# port = 5236
# schema = APP
# user = APP
# password = your_password
